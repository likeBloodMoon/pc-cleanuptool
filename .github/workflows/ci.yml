name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~\Documents\WindowsPowerShell\Modules
          key: ps-modules-${{ runner.os }}-psa1.22-pester5.5

      - name: Install PSScriptAnalyzer and Pester
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Force -Scope CurrentUser
          }
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.5.0')) {
              Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      # Runs under Windows PowerShell 5.1 - the runtime the GUI actually
      # targets - so a 5.1-only syntax break cannot slip through.
      - name: Syntax and unit tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./build/Invoke-Build.ps1 -Task Test

      - name: PSScriptAnalyzer
        shell: powershell
        run: ./build/Invoke-Build.ps1 -Task Analyze

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: testResults.xml
          if-no-files-found: ignore

  test-pwsh7:
    name: Test on PowerShell 7
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Syntax and unit tests (PowerShell 7)
        shell: pwsh
        run: ./build/Invoke-Build.ps1 -Task Test
